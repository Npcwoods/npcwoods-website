<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing:border-box; }
    html, body { width:1200px; height:630px; margin:0; overflow:hidden; }
    body { background:#1C2B39; color:#F7F8F5; font-family:Inter,Arial,sans-serif; }
    .card { position:relative; width:1200px; height:630px; overflow:hidden; isolation:isolate; background:radial-gradient(ellipse 48% 92% at 51% 52%,#29495a 0%,#1c2b39 68%); }
    .particle-field { position:absolute; inset:-130px 0 0; z-index:-1; opacity:.78; background-image:
      radial-gradient(circle at 48% 4%,#d9fff3 0 2px,transparent 3px), radial-gradient(circle at 56% 10%,#a5e1d1 0 3px,transparent 4px), radial-gradient(circle at 42% 14%,#e7fff9 0 2px,transparent 3px), radial-gradient(circle at 66% 17%,#9fdbcb 0 3px,transparent 4px), radial-gradient(circle at 36% 20%,#d9fff3 0 2px,transparent 3px), radial-gradient(circle at 61% 27%,#e7fff9 0 4px,transparent 5px), radial-gradient(circle at 43% 29%,#9fdbcb 0 3px,transparent 4px), radial-gradient(circle at 70% 32%,#d9fff3 0 2px,transparent 3px), radial-gradient(circle at 31% 34%,#e7fff9 0 3px,transparent 4px), radial-gradient(circle at 56% 39%,#a5e1d1 0 2px,transparent 3px), radial-gradient(circle at 39% 43%,#d9fff3 0 4px,transparent 5px), radial-gradient(circle at 64% 46%,#e7fff9 0 2px,transparent 3px), radial-gradient(circle at 29% 49%,#9fdbcb 0 3px,transparent 4px), radial-gradient(circle at 73% 52%,#d9fff3 0 2px,transparent 3px), radial-gradient(circle at 47% 57%,#e7fff9 0 3px,transparent 4px), radial-gradient(circle at 58% 62%,#a5e1d1 0 4px,transparent 5px), radial-gradient(circle at 35% 65%,#d9fff3 0 2px,transparent 3px), radial-gradient(circle at 68% 70%,#e7fff9 0 3px,transparent 4px), radial-gradient(circle at 42% 74%,#9fdbcb 0 2px,transparent 3px), radial-gradient(circle at 56% 79%,#d9fff3 0 4px,transparent 5px), radial-gradient(circle at 30% 82%,#e7fff9 0 2px,transparent 3px), radial-gradient(circle at 71% 86%,#a5e1d1 0 3px,transparent 4px), radial-gradient(circle at 46% 92%,#d9fff3 0 2px,transparent 3px);
      filter:drop-shadow(0 0 7px rgba(177,236,220,.7)); }
    .brand { position:absolute; top:52px; left:70px; font-family:Fraunces,Georgia,serif; font-size:31px; font-weight:600; letter-spacing:-.02em; }
    .eyebrow { position:absolute; top:62px; right:70px; color:#b7ded0; font-size:17px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; }
    .content { position:absolute; top:166px; left:125px; width:950px; text-align:center; }
    h1 { margin:0; font-family:Fraunces,Georgia,serif; font-size:77px; font-weight:500; letter-spacing:-.045em; line-height:1.01; text-shadow:0 4px 24px rgba(0,0,0,.35); }
    h1 em { color:#b7ded0; font-style:italic; }
    .detail { margin:27px 0 0; font-size:24px; font-weight:600; letter-spacing:-.01em; }
    .pill { display:inline-block; margin-top:31px; padding:16px 29px; border-radius:999px; background:#e8836b; box-shadow:0 12px 30px rgba(232,131,107,.32); color:#fff; font-size:22px; font-weight:700; }
  </style>
</head>
<body>
  <div class="card">
    <div class="particle-field"></div>
    <div class="brand">NPCWoods</div>
    <div class="eyebrow">$59 flat-fee visit</div>
    <div class="content">
      <h1>Real care doesn't need <em>a waiting room.</em></h1>
      <p class="detail">Text-based care for common health concerns</p>
      <div class="pill">Text (480) 639-4722</div>
    </div>
  </div>
</body>
</html>
