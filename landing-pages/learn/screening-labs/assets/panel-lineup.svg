<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 529" width="640" height="529" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Five common screening tests</title><rect width="640" height="529" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="527" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Five common screening tests</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">What each one checks, in one line.</text><rect x="28" y="129" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="139" width="144" height="46" rx="10" fill="#0369A1"/><text x="112" y="158.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Metabolic</text><text x="112" y="176.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">panel</text><text x="200" y="159" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Kidneys, liver, salts like sodium and</text><text x="200" y="180" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">potassium, and blood sugar.</text><rect x="28" y="205" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="215" width="144" height="46" rx="10" fill="#0E7490"/><text x="112" y="243.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cholesterol</text><text x="200" y="235" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">LDL, HDL, and triglycerides: the fats</text><text x="200" y="256" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">riding in your blood.</text><rect x="28" y="281" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="291" width="144" height="46" rx="10" fill="#334155"/><text x="112" y="319.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A1c</text><text x="200" y="311" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Your average blood sugar over about</text><text x="200" y="332" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">three months.</text><rect x="28" y="357" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="367" width="144" height="46" rx="10" fill="#0369A1"/><text x="112" y="395.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">TSH (thyroid)</text><text x="200" y="387" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">The signal that tells your thyroid how</text><text x="200" y="408" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">hard to work.</text><rect x="28" y="433" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="443" width="144" height="46" rx="10" fill="#0E7490"/><text x="112" y="471.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">CBC</text><text x="200" y="463" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red cells, white cells, and platelets:</text><text x="200" y="484" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">the three crews in your blood.</text></svg>