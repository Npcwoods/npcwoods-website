<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 718" width="360" height="718" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>A starting schedule for most adults</title><rect width="360" height="718" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="716" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">A starting schedule for</text><text x="24" y="87" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">most adults</text><text x="24" y="130" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Risk factors and symptoms move these</text><text x="24" y="152" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">earlier.</text><rect x="20" y="178" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="192" width="131" height="28" rx="14" fill="#0E7490"/><text x="100" y="211" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cholesterol</text><text x="36" y="240" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">About every 4 to 6 years from age</text><text x="36" y="262" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">20. More often with risk.</text><rect x="20" y="288" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="302" width="131" height="28" rx="14" fill="#334155"/><text x="100" y="321" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Sugar (A1c)</text><text x="36" y="350" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">From 35 if you carry extra weight.</text><text x="36" y="372" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">About every 3 years if normal.</text><rect x="20" y="398" width="320" height="78" rx="14" fill="#F6F3EE"/><rect x="34" y="412" width="131" height="28" rx="14" fill="#0369A1"/><text x="100" y="431" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hepatitis C</text><text x="36" y="460" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Once for every adult 18 to 79.</text><rect x="20" y="486" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="500" width="56" height="28" rx="14" fill="#0369A1"/><text x="62" y="519" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">HIV</text><text x="36" y="548" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">At least once from 15 to 65. More</text><text x="36" y="570" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">often with ongoing risk.</text><rect x="20" y="596" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="610" width="159" height="28" rx="14" fill="#0E7490"/><text x="114" y="629" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Kidney numbers</text><text x="36" y="658" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">At least yearly with high blood</text><text x="36" y="680" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">pressure or diabetes.</text></svg>