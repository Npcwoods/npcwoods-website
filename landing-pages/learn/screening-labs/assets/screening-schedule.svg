<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 523" width="640" height="523" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>A starting schedule for most adults</title><rect width="640" height="523" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="521" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">A starting schedule for most adults</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Risk factors and symptoms move these earlier.</text><rect x="28" y="129" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="139" width="144" height="46" rx="10" fill="#0E7490"/><text x="112" y="167.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cholesterol</text><text x="200" y="159" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">About every 4 to 6 years from age 20.</text><text x="200" y="180" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">More often with risk.</text><rect x="28" y="205" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="215" width="144" height="46" rx="10" fill="#334155"/><text x="112" y="243.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Sugar (A1c)</text><text x="200" y="235" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">From 35 if you carry extra weight. About</text><text x="200" y="256" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">every 3 years if normal.</text><rect x="28" y="281" width="584" height="60" rx="14" fill="#F6F3EE"/><rect x="40" y="291" width="144" height="40" rx="10" fill="#0369A1"/><text x="112" y="316.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hepatitis C</text><text x="200" y="311" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Once for every adult 18 to 79.</text><rect x="28" y="351" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="361" width="144" height="46" rx="10" fill="#0369A1"/><text x="112" y="389.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">HIV</text><text x="200" y="381" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">At least once from 15 to 65. More often</text><text x="200" y="402" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">with ongoing risk.</text><rect x="28" y="427" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="437" width="144" height="46" rx="10" fill="#0E7490"/><text x="112" y="465.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Kidney numbers</text><text x="200" y="457" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">At least yearly with high blood pressure</text><text x="200" y="478" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">or diabetes.</text></svg>