<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 481" width="360" height="481" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>A1c ranges</title><rect width="360" height="481" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="479" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">A1c ranges</text><text x="24" y="99" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Average blood sugar over about three</text><text x="24" y="121" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">months.</text><clipPath id="rb"><rect x="20" y="147" width="320" height="22" rx="11"/></clipPath><g clip-path="url(#rb)"><rect x="20.0" y="147" width="134.9" height="22" fill="#15803D"/><rect x="154.4" y="147" width="96.5" height="22" fill="#B45309"/><rect x="250.4" y="147" width="90.1" height="22" fill="#B42318"/></g><rect x="20" y="189" width="320" height="56" rx="14" fill="#F6F3EE"/><rect x="34" y="205" width="24" height="24" rx="6" fill="#15803D"/><text x="70" y="214" font-size="18" fill="#1A1A2E" font-weight="800" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Normal</text><text x="70" y="235" font-size="16" fill="#4A4A5A" font-weight="600" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Below 5.7%</text><rect x="20" y="255" width="320" height="56" rx="14" fill="#F6F3EE"/><rect x="34" y="271" width="24" height="24" rx="6" fill="#B45309"/><text x="70" y="280" font-size="18" fill="#1A1A2E" font-weight="800" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Prediabetes</text><text x="70" y="301" font-size="16" fill="#4A4A5A" font-weight="600" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">5.7% to 6.4%</text><rect x="20" y="321" width="320" height="56" rx="14" fill="#F6F3EE"/><rect x="34" y="337" width="24" height="24" rx="6" fill="#B42318"/><text x="70" y="346" font-size="18" fill="#1A1A2E" font-weight="800" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Diabetes</text><text x="70" y="367" font-size="16" fill="#4A4A5A" font-weight="600" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">6.5% or higher</text><text x="24" y="405" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Diabetes is confirmed with two</text><text x="24" y="427" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">tests. Some conditions can make the</text><text x="24" y="449" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A1c read falsely high or low.</text></svg>