<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 345" width="640" height="345" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>A1c ranges</title><rect width="640" height="345" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="343" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">A1c ranges</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Average blood sugar over about three months.</text><rect x="36" y="139" width="239" height="56" fill="#15803D" rx="14"/><text x="155.28" y="174" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Normal</text><text x="155.28" y="225" font-size="15" fill="#1A1A2E" font-weight="700" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Below 5.7%</text><rect x="275" y="139" width="170" height="56" fill="#B45309" rx="0"/><text x="359.76" y="174" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Prediabetes</text><text x="359.76" y="225" font-size="15" fill="#1A1A2E" font-weight="700" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">5.7% to 6.4%</text><rect x="445" y="139" width="159" height="56" fill="#B42318" rx="14"/><text x="524.48" y="174" font-size="17" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Diabetes</text><text x="524.48" y="225" font-size="15" fill="#1A1A2E" font-weight="700" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">6.5% or higher</text><text x="36" y="285" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Diabetes is confirmed with two tests. Some conditions can make</text><text x="36" y="305" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">the A1c read falsely high or low.</text></svg>