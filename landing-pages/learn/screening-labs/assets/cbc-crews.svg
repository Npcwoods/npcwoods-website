<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 323" width="640" height="323" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>The three crews in a CBC</title><rect width="640" height="323" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="321" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">The three crews in a CBC</text><rect x="28" y="104" width="185" height="189" rx="14" fill="#F6F3EE"/><rect x="28" y="104" width="185" height="8" rx="4" fill="#B42318"/><text x="40.0" y="144" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red cells</text><circle cx="44" cy="166" r="4" fill="#B42318"/><text x="56.0" y="171" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Deliver oxygen</text><circle cx="44" cy="194" r="4" fill="#B42318"/><text x="56.0" y="199" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hemoglobin</text><circle cx="44" cy="222" r="4" fill="#B42318"/><text x="56.0" y="227" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hematocrit</text><circle cx="44" cy="250" r="4" fill="#B42318"/><text x="56.0" y="255" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">MCV (size)</text><rect x="227" y="104" width="185" height="189" rx="14" fill="#F6F3EE"/><rect x="227" y="104" width="185" height="8" rx="4" fill="#0369A1"/><text x="239.33333333333334" y="144" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">White cells</text><circle cx="243" cy="166" r="4" fill="#0369A1"/><text x="255.33333333333334" y="171" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fight germs</text><circle cx="243" cy="194" r="4" fill="#0369A1"/><text x="255.33333333333334" y="199" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">WBC count</text><circle cx="243" cy="222" r="4" fill="#0369A1"/><text x="255.33333333333334" y="227" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Types of white</text><text x="255.33333333333334" y="247" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">cells</text><rect x="427" y="104" width="185" height="189" rx="14" fill="#F6F3EE"/><rect x="427" y="104" width="185" height="8" rx="4" fill="#334155"/><text x="438.6666666666667" y="144" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Platelets</text><circle cx="443" cy="166" r="4" fill="#334155"/><text x="454.6666666666667" y="171" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Plug leaks</text><circle cx="443" cy="194" r="4" fill="#334155"/><text x="454.6666666666667" y="199" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Platelet count</text></svg>