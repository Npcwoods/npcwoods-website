<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 630" width="360" height="630" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Lipid panel: common adult targets</title><rect width="360" height="630" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="628" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Lipid panel: common</text><text x="24" y="87" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">adult targets</text><text x="24" y="130" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Your own goal depends on your whole</text><text x="24" y="152" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">heart risk.</text><rect x="20" y="178" width="320" height="78" rx="14" fill="#F6F3EE"/><rect x="34" y="192" width="75" height="28" rx="14" fill="#334155"/><text x="72" y="211" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Total</text><text x="36" y="240" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Under 200 mg/dL</text><rect x="20" y="266" width="320" height="122" rx="14" fill="#F6F3EE"/><rect x="34" y="280" width="56" height="28" rx="14" fill="#B42318"/><text x="62" y="299" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">LDL</text><text x="36" y="328" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Lower is better. Under 100 mg/dL</text><text x="36" y="350" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">for most adults. The drop-off</text><text x="36" y="372" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">trucks.</text><rect x="20" y="398" width="320" height="122" rx="14" fill="#F6F3EE"/><rect x="34" y="412" width="56" height="28" rx="14" fill="#15803D"/><text x="62" y="431" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">HDL</text><text x="36" y="460" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Higher is better. 40+ mg/dL for</text><text x="36" y="482" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">men, 50+ for women. The pickup</text><text x="36" y="504" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">trucks.</text><rect x="20" y="530" width="320" height="78" rx="14" fill="#F6F3EE"/><rect x="34" y="544" width="150" height="28" rx="14" fill="#0369A1"/><text x="109" y="563" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Triglycerides</text><text x="36" y="592" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Under 150 mg/dL</text></svg>