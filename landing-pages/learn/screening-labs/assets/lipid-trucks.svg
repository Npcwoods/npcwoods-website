<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 441" width="640" height="441" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Lipid panel: common adult targets</title><rect width="640" height="441" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="439" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Lipid panel: common adult targets</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Your own goal depends on your whole heart risk.</text><rect x="28" y="129" width="584" height="60" rx="14" fill="#F6F3EE"/><rect x="40" y="139" width="144" height="40" rx="10" fill="#334155"/><text x="112" y="164.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Total</text><text x="200" y="159" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Under 200 mg/dL</text><rect x="28" y="199" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="209" width="144" height="46" rx="10" fill="#B42318"/><text x="112" y="237.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">LDL</text><text x="200" y="229" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Lower is better. Under 100 mg/dL for</text><text x="200" y="250" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">most adults. The drop-off trucks.</text><rect x="28" y="275" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="285" width="144" height="46" rx="10" fill="#15803D"/><text x="112" y="313.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">HDL</text><text x="200" y="305" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Higher is better. 40+ mg/dL for men, 50+</text><text x="200" y="326" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">for women. The pickup trucks.</text><rect x="28" y="351" width="584" height="60" rx="14" fill="#F6F3EE"/><rect x="40" y="361" width="144" height="40" rx="10" fill="#0369A1"/><text x="112" y="386.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Triglycerides</text><text x="200" y="381" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Under 150 mg/dL</text></svg>