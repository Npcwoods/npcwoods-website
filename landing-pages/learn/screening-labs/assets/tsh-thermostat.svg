<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 560" width="640" height="560" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>TSH: the thermostat signal</title><rect width="640" height="560" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="558" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">TSH: the thermostat signal</text><circle cx="58" cy="130" r="14" fill="#fff" stroke="#0369A1" stroke-width="4"/><text x="96" y="134" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Brain senses the level</text><text x="96" y="159" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">The pituitary gland checks how much thyroid</text><text x="96" y="179" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">hormone is in your blood.</text><path d="M58 146 V241" stroke="#0369A1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="245" r="14" fill="#fff" stroke="#0E7490" stroke-width="4"/><text x="96" y="249" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Brain sends TSH</text><text x="96" y="274" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">TSH is the message: turn the furnace up.</text><path d="M58 261 V336" stroke="#0369A1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="340" r="14" fill="#fff" stroke="#B42318" stroke-width="4"/><text x="96" y="344" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">High TSH</text><text x="96" y="369" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Usually means the thyroid is slow</text><text x="96" y="389" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">(underactive). The brain is yelling.</text><path d="M58 356 V451" stroke="#0369A1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="455" r="14" fill="#fff" stroke="#B45309" stroke-width="4"/><text x="96" y="459" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Low TSH</text><text x="96" y="484" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Usually means the thyroid is running hot</text><text x="96" y="504" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">(overactive). The brain is quiet.</text></svg>