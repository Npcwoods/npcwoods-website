<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 715" width="360" height="715" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>BMP vs CMP</title><rect width="360" height="715" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="713" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">BMP vs CMP</text><text x="24" y="99" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Same tube. The CMP also checks liver</text><text x="24" y="121" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">and protein.</text><rect x="20" y="147" width="320" height="296" rx="14" fill="#F6F3EE"/><rect x="20" y="147" width="8" height="296" rx="4" fill="#0369A1"/><text x="36" y="187" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Basic (BMP): 8 tests</text><circle cx="42" cy="210" r="4.5" fill="#0369A1"/><text x="56" y="215" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Glucose (sugar)</text><circle cx="42" cy="238" r="4.5" fill="#0369A1"/><text x="56" y="243" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Calcium</text><circle cx="42" cy="266" r="4.5" fill="#0369A1"/><text x="56" y="271" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Sodium</text><circle cx="42" cy="294" r="4.5" fill="#0369A1"/><text x="56" y="299" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Potassium</text><circle cx="42" cy="322" r="4.5" fill="#0369A1"/><text x="56" y="327" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Chloride</text><circle cx="42" cy="350" r="4.5" fill="#0369A1"/><text x="56" y="355" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Carbon dioxide</text><circle cx="42" cy="378" r="4.5" fill="#0369A1"/><text x="56" y="383" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">BUN (kidney)</text><circle cx="42" cy="406" r="4.5" fill="#0369A1"/><text x="56" y="411" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Creatinine (kidney)</text><rect x="20" y="455" width="320" height="240" rx="14" fill="#F6F3EE"/><rect x="20" y="455" width="8" height="240" rx="4" fill="#0E7490"/><text x="36" y="495" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">CMP adds 6 more</text><circle cx="42" cy="518" r="4.5" fill="#0E7490"/><text x="56" y="523" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Albumin</text><circle cx="42" cy="546" r="4.5" fill="#0E7490"/><text x="56" y="551" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Total protein</text><circle cx="42" cy="574" r="4.5" fill="#0E7490"/><text x="56" y="579" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">ALT (liver)</text><circle cx="42" cy="602" r="4.5" fill="#0E7490"/><text x="56" y="607" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">AST (liver)</text><circle cx="42" cy="630" r="4.5" fill="#0E7490"/><text x="56" y="635" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">ALP (liver and bone)</text><circle cx="42" cy="658" r="4.5" fill="#0E7490"/><text x="56" y="663" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Bilirubin (bile)</text></svg>