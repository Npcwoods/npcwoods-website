<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 460" width="640" height="460" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>BMP vs CMP</title><rect width="640" height="460" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="458" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#0369A1"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">BMP vs CMP</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Same tube. The CMP also checks liver and protein.</text><rect x="28" y="129" width="285" height="301" rx="14" fill="#F6F3EE"/><rect x="28" y="129" width="285" height="8" rx="4" fill="#0369A1"/><text x="40.0" y="169" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Basic (BMP): 8 tests</text><circle cx="44" cy="191" r="4" fill="#0369A1"/><text x="56.0" y="196" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Glucose (sugar)</text><circle cx="44" cy="219" r="4" fill="#0369A1"/><text x="56.0" y="224" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Calcium</text><circle cx="44" cy="247" r="4" fill="#0369A1"/><text x="56.0" y="252" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Sodium</text><circle cx="44" cy="275" r="4" fill="#0369A1"/><text x="56.0" y="280" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Potassium</text><circle cx="44" cy="303" r="4" fill="#0369A1"/><text x="56.0" y="308" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Chloride</text><circle cx="44" cy="331" r="4" fill="#0369A1"/><text x="56.0" y="336" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Carbon dioxide</text><circle cx="44" cy="359" r="4" fill="#0369A1"/><text x="56.0" y="364" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">BUN (kidney)</text><circle cx="44" cy="387" r="4" fill="#0369A1"/><text x="56.0" y="392" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Creatinine (kidney)</text><rect x="327" y="129" width="285" height="301" rx="14" fill="#F6F3EE"/><rect x="327" y="129" width="285" height="8" rx="4" fill="#0E7490"/><text x="339.0" y="169" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">CMP adds 6 more</text><circle cx="343" cy="191" r="4" fill="#0E7490"/><text x="355.0" y="196" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Albumin</text><circle cx="343" cy="219" r="4" fill="#0E7490"/><text x="355.0" y="224" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Total protein</text><circle cx="343" cy="247" r="4" fill="#0E7490"/><text x="355.0" y="252" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">ALT (liver)</text><circle cx="343" cy="275" r="4" fill="#0E7490"/><text x="355.0" y="280" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">AST (liver)</text><circle cx="343" cy="303" r="4" fill="#0E7490"/><text x="355.0" y="308" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">ALP (liver and bone)</text><circle cx="343" cy="331" r="4" fill="#0E7490"/><text x="355.0" y="336" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Bilirubin (bile)</text></svg>