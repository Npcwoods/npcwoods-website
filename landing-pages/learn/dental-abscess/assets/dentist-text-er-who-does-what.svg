<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 672" width="640" height="672" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Who does what: dentist, text visit, ER</title><defs>
