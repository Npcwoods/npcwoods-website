<linearGradient id="wdpi" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#F59A8F"/><stop offset="1" stop-color="#E06F63"/></linearGradient>
<linearGradient id="wdgu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B3B0"/><stop offset="1" stop-color="#E59591"/></linearGradient>
<linearGradient id="wdbo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E9DC"/><stop offset="1" stop-color="#E4D8C4"/></linearGradient>
<radialGradient id="wdps" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6DA"/><stop offset="1" stop-color="#F1CF7A"/></radialGradient>
<linearGradient id="wdbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
