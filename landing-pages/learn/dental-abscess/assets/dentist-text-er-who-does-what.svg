<pattern id="wddots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.4" fill="#D8C9B0"/><circle cx="14" cy="13" r="1.8" fill="#D8C9B0"/></pattern>
<filter id="wdsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1A1A2E" flood-opacity=".16"/></filter>
<filter id="wdsm" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A1A2E" flood-opacity=".14"/></filter>
</defs><rect x="10" y="10" width="620" height="196" rx="24" fill="#1A1A2E" filter="url(#wdsm)"/><text x="38" y="56" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">Dentist</text><text x="602" y="56" font-size="17" font-weight="700" fill="rgba(255,255,255,.85)" text-anchor="end">fixes the tooth</text><path d="M38 72 H602" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><circle cx="50" cy="101" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 101 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="108" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Exam and X-ray</text><circle cx="50" cy="141" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 141 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="148" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Opens and drains the pocket</text><circle cx="50" cy="181" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 181 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="188" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Root canal or removes the tooth</text><rect x="10" y="224" width="620" height="236" rx="24" fill="#007AFF" filter="url(#wdsm)"/><rect x="10" y="224" width="620" height="236" rx="24" fill="none" stroke="#fff" stroke-width="2"/><text x="38" y="270" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">Text visit with Chris</text><text x="602" y="270" font-size="17" font-weight="700" fill="rgba(255,255,255,.85)" text-anchor="end">the bridge</text><path d="M38 286 H602" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><circle cx="50" cy="315" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 315 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="322" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Asks the red-flag questions</text><circle cx="50" cy="355" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 355 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="362" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Symptom care plan for tonight</text><circle cx="50" cy="395" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 395 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="402" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Helper medicine only if it fits</text><circle cx="50" cy="435" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 435 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="442" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Points you to the right door</text><rect x="10" y="478" width="620" height="156" rx="24" fill="url(#wdrd)" filter="url(#wdsm)"/><text x="38" y="524" font-size="26" font-weight="800" fill="#FFFFFF" text-anchor="start">ER</text><text x="602" y="524" font-size="17" font-weight="700" fill="rgba(255,255,255,.85)" text-anchor="end">the airway door</text><path d="M38 540 H602" stroke="rgba(255,255,255,.3)" stroke-width="1.5"/><circle cx="50" cy="569" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 569 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="576" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Trouble breathing or swallowing</text><circle cx="50" cy="609" r="9" fill="rgba(255,255,255,.22)"/><path d="M45 609 l4 4 l7 -8" stroke="#fff" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="72" y="616" font-size="20" font-weight="600" fill="#FFFFFF" text-anchor="start">Swelling spreading in face or neck</text></svg>
