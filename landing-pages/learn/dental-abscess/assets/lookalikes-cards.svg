<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 820" width="640" height="820" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Four lookalikes of a dental abscess</title><defs>
<linearGradient id="lken" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4F0"/></linearGradient>
<linearGradient id="lkde" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="340"><stop offset="0" stop-color="#F5EAD3"/><stop offset="1" stop-color="#E6D3AE"/></linearGradient>
<linearGradient id="lkpu" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#F7B9B1"/><stop offset="1" stop-color="#EE958B"/></linearGradient>
<linearGradient id="lkpd" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#B9ADA2"/><stop offset="1" stop-color="#8F8379"/></linearGradient>
<linearGradient id="lkpi" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#F59A8F"/><stop offset="1" stop-color="#E06F63"/></linearGradient>
<linearGradient id="lkgu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B3B0"/><stop offset="1" stop-color="#E59591"/></linearGradient>
<linearGradient id="lkbo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E9DC"/><stop offset="1" stop-color="#E4D8C4"/></linearGradient>
<radialGradient id="lkps" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6DA"/><stop offset="1" stop-color="#F1CF7A"/></radialGradient>
<linearGradient id="lkbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
<linearGradient id="lkrd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8321F"/><stop offset="1" stop-color="#8F1C12"/></linearGradient>
<pattern id="lkdots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.4" fill="#D8C9B0"/><circle cx="14" cy="13" r="1.8" fill="#D8C9B0"/></pattern>
<filter id="lksh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1A1A2E" flood-opacity=".16"/></filter>
<filter id="lksm" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A1A2E" flood-opacity=".14"/></filter>
</defs><rect x="10" y="10" width="304" height="332" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#lksm)"/><rect x="10" y="10" width="304" height="8" rx="4" fill="#1A1A2E"/><g transform="translate(82 40)"><path d="M20 70 C20 30 60 20 80 40 C100 20 140 30 140 70 Z" fill="#E3ECFB" stroke="#7FA6E8" stroke-width="3"/><path d="M50 52 l0 14 M80 46 l0 16 M110 52 l0 14" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/><path d="M44 62 l6 8 l6 -8 M74 58 l6 8 l6 -8 M104 62 l6 8 l6 -8" stroke="#2563EB" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M14 92 H146" stroke="#E59591" stroke-width="16" stroke-linecap="round"/><path d="M22 86 C22 76 46 76 46 86 L44 104 C38 110 30 110 24 104 Z" fill="#fff" stroke="#C9B48C" stroke-width="2.5"/><path d="M56 86 C56 76 80 76 80 86 L78 104 C72 110 64 110 58 104 Z" fill="#fff" stroke="#C9B48C" stroke-width="2.5"/><path d="M90 86 C90 76 114 76 114 86 L112 104 C106 110 98 110 92 104 Z" fill="#fff" stroke="#C9B48C" stroke-width="2.5"/><path d="M114 86 C114 76 138 76 138 86 L136 104 C130 110 122 110 116 104 Z" fill="#fff" stroke="#C9B48C" stroke-width="2.5"/></g><text x="34" y="206" font-size="23" font-weight="800" fill="#1A1A2E" text-anchor="start">Sinus pressure</text><text x="34" y="240" font-size="18" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="34" dy="0">Several upper teeth</tspan><tspan x="34" dy="22.5">ache together. Worse</tspan><tspan x="34" dy="22.5">when you bend over.</tspan></text><rect x="326" y="10" width="304" height="332" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#lksm)"/><rect x="326" y="10" width="304" height="8" rx="4" fill="#1A1A2E"/><g transform="translate(398 40)"><ellipse cx="128" cy="50" rx="13" ry="22" fill="#E3ECFB" stroke="#7FA6E8" stroke-width="3"/><path d="M70 30 C80 22 100 22 108 32" stroke="#B8C3D9" stroke-width="5" fill="none" stroke-linecap="round"/><path d="M98 44 C100 70 102 92 96 106 L22 112 C14 112 12 100 20 98 L84 92 C88 76 86 58 88 44 Z" fill="#F5EAD3" stroke="#C9B48C" stroke-width="3" stroke-linejoin="round"/><circle cx="93" cy="40" r="10" fill="#F5EAD3" stroke="#C9B48C" stroke-width="3"/><path d="M78 34 A16 16 0 0 1 108 34" stroke="#B42318" stroke-width="4.5" fill="none" stroke-linecap="round"/><path d="M60 22 l-10 -8 M58 38 l-14 0 M62 52 l-10 8" stroke="#B42318" stroke-width="3.5" stroke-linecap="round"/></g><text x="350" y="206" font-size="23" font-weight="800" fill="#1A1A2E" text-anchor="start">Jaw joint</text><text x="350" y="240" font-size="18" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="350" dy="0">Sore hinge in front</tspan><tspan x="350" dy="22.5">of the ear. May click</tspan><tspan x="350" dy="22.5">or pop. Gum is calm.</tspan></text><rect x="10" y="356" width="304" height="332" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#lksm)"/><rect x="10" y="356" width="304" height="8" rx="4" fill="#1A1A2E"/><g transform="translate(82 386)"><path d="M14 40 C40 20 120 20 146 40 C150 80 120 110 80 112 C40 110 10 80 14 40 Z" fill="#F4B3B0" stroke="#E59591" stroke-width="3"/><path d="M30 46 C60 34 100 34 130 46" stroke="#E59591" stroke-width="3" fill="none"/><ellipse cx="80" cy="76" rx="22" ry="15" fill="none" stroke="#B42318" stroke-width="4"/><ellipse cx="80" cy="76" rx="15" ry="9" fill="#FBF3D9" stroke="#E8D8A8" stroke-width="2"/></g><text x="34" y="552" font-size="23" font-weight="800" fill="#1A1A2E" text-anchor="start">Canker sore</text><text x="34" y="586" font-size="18" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="34" dy="0">Shallow sore on soft</tspan><tspan x="34" dy="22.5">skin. Stings. No deep</tspan><tspan x="34" dy="22.5">throb in the bone.</tspan></text><rect x="326" y="356" width="304" height="332" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#lksm)"/><rect x="326" y="356" width="304" height="8" rx="4" fill="#1A1A2E"/><g transform="translate(398 386)"><path d="M70 20 C104 18 122 44 118 72 C116 90 102 96 98 110 C94 124 76 128 66 116" stroke="#7FA6E8" stroke-width="5" fill="#E3ECFB" stroke-linecap="round"/><path d="M80 50 C96 46 104 60 96 72 C90 80 84 84 86 94" stroke="#7FA6E8" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="84" cy="86" r="7" fill="#B42318"/><path d="M40 60 l-14 -6 M38 76 l-16 0 M40 92 l-14 6" stroke="#B42318" stroke-width="3.5" stroke-linecap="round"/></g><text x="350" y="552" font-size="23" font-weight="800" fill="#1A1A2E" text-anchor="start">Ear trouble</text><text x="350" y="586" font-size="18" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="350" dy="0">The ear itself hurts.</tspan><tspan x="350" dy="22.5">The teeth check out</tspan><tspan x="350" dy="22.5">calm.</tspan></text><rect x="10" y="704" width="620" height="106" rx="22" fill="#FFF1F0" stroke="#B42318" stroke-width="2.5"/><g transform="translate(36 728)"><path d="M30 0 L60 54 L0 54 Z" fill="#B42318"/><rect x="27" y="16" width="6" height="22" rx="3" fill="#fff"/><circle cx="30" cy="45" r="3.5" fill="#fff"/></g><text x="116" y="746" font-size="19" font-weight="800" fill="#7A271A" text-anchor="start"><tspan x="116" dy="0">Jaw pain with chest pressure, sweating,</tspan><tspan x="116" dy="23.8">or short of breath: call 911.</tspan></text></svg>
