<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 816" width="640" height="816" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>What dental abscess care looks like, step by step</title><defs>
<linearGradient id="cren" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#DCE4F0"/></linearGradient>
<linearGradient id="crde" gradientUnits="userSpaceOnUse" x1="0" y1="20" x2="0" y2="340"><stop offset="0" stop-color="#F5EAD3"/><stop offset="1" stop-color="#E6D3AE"/></linearGradient>
<linearGradient id="crpu" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#F7B9B1"/><stop offset="1" stop-color="#EE958B"/></linearGradient>
<linearGradient id="crpd" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#B9ADA2"/><stop offset="1" stop-color="#8F8379"/></linearGradient>
<linearGradient id="crpi" gradientUnits="userSpaceOnUse" x1="0" y1="80" x2="0" y2="330"><stop offset="0" stop-color="#F59A8F"/><stop offset="1" stop-color="#E06F63"/></linearGradient>
<linearGradient id="crgu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B3B0"/><stop offset="1" stop-color="#E59591"/></linearGradient>
<linearGradient id="crbo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E9DC"/><stop offset="1" stop-color="#E4D8C4"/></linearGradient>
<radialGradient id="crps" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6DA"/><stop offset="1" stop-color="#F1CF7A"/></radialGradient>
<linearGradient id="crbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
<linearGradient id="crrd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8321F"/><stop offset="1" stop-color="#8F1C12"/></linearGradient>
<pattern id="crdots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.4" fill="#D8C9B0"/><circle cx="14" cy="13" r="1.8" fill="#D8C9B0"/></pattern>
<filter id="crsh" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#1A1A2E" flood-opacity=".16"/></filter>
<filter id="crsm" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A1A2E" flood-opacity=".14"/></filter>
</defs><path d="M64 80 V680" stroke="#B42318" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/><rect x="10" y="12" width="620" height="168" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#crsm)"/><circle cx="64" cy="56" r="24" fill="url(#crbl)"/><text x="64" y="64" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text><g transform="translate(520 56.0)"><rect x="4" y="8" width="72" height="60" rx="10" fill="#1A1A2E"/><path d="M26 22 C26 16 34 14 40 18 C46 14 54 16 54 22 C54 34 50 40 48 56 C46 60 42 58 42 52 L40 44 L38 52 C38 58 34 60 32 56 C30 40 26 34 26 22 Z" fill="#E8EEF8"/><circle cx="34" cy="62" r="5" fill="#B42318" opacity=".9"/></g><text x="110" y="64" font-size="24" font-weight="800" fill="#1A1A2E" text-anchor="start">Find the source</text><text x="110" y="100" font-size="19" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="110" dy="0">A dentist checks the tooth</tspan><tspan x="110" dy="23.8">and takes an X-ray.</tspan></text><rect x="10" y="196" width="620" height="168" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#crsm)"/><circle cx="64" cy="240" r="24" fill="url(#crbl)"/><text x="64" y="248" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text><g transform="translate(520 240.0)"><path d="M20 10 C20 0 60 0 60 10 C60 34 54 48 50 70 C48 76 44 74 44 68 L40 50 L36 68 C36 74 32 76 30 70 C26 48 20 34 20 10 Z" fill="#F5EAD3" stroke="#C9B48C" stroke-width="2.5"/><path d="M40 8 V48" stroke="#B42318" stroke-width="4" stroke-dasharray="5 5"/><path d="M30 18 L40 6 L50 18" stroke="#B42318" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g><text x="110" y="248" font-size="24" font-weight="800" fill="#1A1A2E" text-anchor="start">Let the pus out</text><text x="110" y="284" font-size="19" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="110" dy="0">Open the tooth, or a small</tspan><tspan x="110" dy="23.8">cut in the gum drains it.</tspan></text><rect x="10" y="380" width="620" height="196" rx="22" fill="#FFFFFF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#crsm)"/><circle cx="64" cy="424" r="24" fill="url(#crbl)"/><text x="64" y="432" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">3</text><g transform="translate(520 438.0)"><path d="M20 10 C20 0 60 0 60 10 C60 34 54 48 50 70 C48 76 44 74 44 68 L40 50 L36 68 C36 74 32 76 30 70 C26 48 20 34 20 10 Z" fill="#F5EAD3" stroke="#C9B48C" stroke-width="2.5"/><path d="M34 16 L34 66 M46 16 L46 66" stroke="#6B7A99" stroke-width="5" stroke-linecap="round"/><path d="M22 8 C30 2 50 2 58 8 L58 16 L22 16 Z" fill="#C7CFDD"/></g><text x="110" y="432" font-size="24" font-weight="800" fill="#1A1A2E" text-anchor="start">Fix the source</text><text x="110" y="468" font-size="19" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="110" dy="0">Root canal: clean and seal</tspan><tspan x="110" dy="23.8">the nerve room. Or remove</tspan><tspan x="110" dy="23.8">the tooth if it can't be saved.</tspan></text><rect x="10" y="592" width="620" height="168" rx="22" fill="#EEF4FF" stroke="rgba(26,26,46,.10)" stroke-width="1.5" filter="url(#crsm)"/><circle cx="64" cy="636" r="24" fill="url(#crbl)"/><text x="64" y="644" font-size="22" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text><g transform="translate(520 636.0)"><path d="M10 40 C20 20 60 20 70 40" stroke="#2563EB" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M10 40 L10 66 M70 40 L70 66 M40 26 L40 66" stroke="#2563EB" stroke-width="5" stroke-linecap="round"/><path d="M2 66 H78" stroke="#1A1A2E" stroke-width="5" stroke-linecap="round"/></g><text x="110" y="644" font-size="24" font-weight="800" fill="#1A1A2E" text-anchor="start">Helper medicine, if it fits</text><text x="110" y="680" font-size="19" font-weight="500" fill="#4A4A5A" text-anchor="start"><tspan x="110" dy="0">Calms germs as a bridge.</tspan><tspan x="110" dy="23.8">It is not the repair.</tspan></text><text x="320" y="798" font-size="17" font-weight="700" fill="#B42318" text-anchor="middle">Steps 1 to 3 are the dentist. Step 4 never replaces them.</text></svg>
