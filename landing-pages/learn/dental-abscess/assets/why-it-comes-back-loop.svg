 y="321.0" font-size="18" font-weight="800" fill="#1A1A2E" text-anchor="middle"><tspan x="115" dy="0">Helper calms</tspan><tspan x="115" dy="22.5">it for a while</tspan></text><rect x="40" y="606" width="560" height="68" rx="34" fill="url(#lpbl)" filter="url(#lpsm)"/><text x="320" y="648" font-size="21" font-weight="800" fill="#FFFFFF" text-anchor="middle">Break the loop: a dentist fixes the source</text></svg>
