<linearGradient id="fmgu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B3B0"/><stop offset="1" stop-color="#E59591"/></linearGradient>
<linearGradient id="fmbo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1E9DC"/><stop offset="1" stop-color="#E4D8C4"/></linearGradient>
<radialGradient id="fmps" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#FFF6DA"/><stop offset="1" stop-color="#F1CF7A"/></radialGradient>
<linearGradient id="fmbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1D4ED8"/></linearGradient>
<linearGradient id="fmrd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#C8321F"/><stop offset="1" stop-color="#8F1C12"/></linearGradient>
<pattern id="fmdots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="5" cy="5" r="2.4" fill="#D8C9B0"/><circle cx="14" cy="13" r="1.8" fill="#D8C9B0"/></pattern>
