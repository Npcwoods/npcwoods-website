<filter id="fmsm" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#1A1A2E" flood-opacity=".14"/></filter>
</defs><rect x="8" y="8" width="624" height="704" rx="22" fill="#F6F3EE" stroke="rgba(26,26,46,.08)" stroke-width="1.5"/><text x="32" y="50" font-size="16" font-weight="800" fill="#B42318" text-anchor="start" letter-spacing="2">THE FEELING MAP</text><g transform="translate(86 150) scale(0.6)"><clipPath id="fmjc0"><rect x="-70" y="0" width="340" height="402" rx="26"/></clipPath><g clip-path="url(#fmjc0)"><path d="M-70 180 Q0 170 36 168 L164 168 L166 168 Q200 170 270 180 L270 372 Q270 402 240 402 L-40 402 Q-70 402 -70 372 Z" fill="url(#fmbo)"/><path d="M-70 180 Q0 170 36 168 L164 168 L166 168 Q200 170 270 180 L270 372 Q270 402 240 402 L-40 402 Q-70 402 -70 372 Z" fill="url(#fmdots)" opacity=".75"/><path d="M-70 152 Q-10 144 20 129 Q30 123 38 133 L162 133 Q170 123 180 129 Q210 144 270 152 L270 210 Q200 200 160 200 L40 200 Q0 200 -70 210 Z" fill="url(#fmgu)"/><g filter="url(#fmsh)"><path d="M20 60 C20 25 40 8 60 14 C75 18 85 28 100 22 C115 16 125 10 140 14 C165 20 180 35 180 60 C180 95 172 120 165 140 C160 190 158 250 150 320 C148 338 129 338 127 322 C122 270 115 222 100 202 C85 222 78 270 73 322 C71 338 52 338 50 320 C42 250 40 190 35 140 C28 120 20 95 20 60 Z" fill="url(#fmde)" stroke="#C9B48C" stroke-width="2"/></g><clipPath id="fmcc0"><rect x="0" y="0" width="200" height="137"/></clipPath><path d="M20 60 C20 25 40 8 60 14 C75 18 85 28 100 22 C115 16 125 10 140 14 C165 20 180 35 180 60 C180 95 172 120 165 140 C160 190 158 250 150 320 C148 338 129 338 127 322 C122 270 115 222 100 202 C85 222 78 270 73 322 C71 338 52 338 50 320 C42 250 40 190 35 140 C28 120 20 95 20 60 Z" clip-path="url(#fmcc0)" fill="url(#fmen)"/><path d="M37 64 C37 42 50 32 62 34 C76 37 86 44 100 40 C114 36 126 32 138 34 C152 37 163 46 163 64 C163 92 162 118 166 137 L34 137 C38 118 37 92 37 64 Z" fill="url(#fmde)"/><path d="M30 52 C34 34 46 24 58 24" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none" opacity=".9"/><path d="M70 100 C69 84 76 76 86 84 C93 90 107 90 114 84 C124 76 131 84 130 100 C130 126 128 150 126 166 L74 166 C72 150 70 126 70 100 Z" fill="url(#fmpi)"/><path d="M74 160 C70 205 66 262 61.5 326" stroke="url(#fmpi)" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M126 160 C130 205 134 262 138.5 326" stroke="url(#fmpi)" stroke-width="11" stroke-linecap="round" fill="none"/><path d="M83.8 104 C77.8 130 71.8 150 71.8 162 C67.8 205 63.8 262 59.3 330 C57.8 352 37.8 362 7.8 366" stroke="#C8321F" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M111.8 104 C117.8 130 123.8 150 123.8 162 C127.8 205 131.8 262 136.3 330 C137.8 352 157.8 362 187.8 366" stroke="#C8321F" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M88.2 104 C82.2 130 76.2 150 76.2 162 C72.2 205 68.2 262 63.7 330 C62.2 352 42.2 362 12.2 366" stroke="#2F6FE4" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M116.2 104 C122.2 130 128.2 150 128.2 162 C132.2 205 136.2 262 140.7 330 C142.2 352 162.2 362 192.2 366" stroke="#2F6FE4" stroke-width="2.2" fill="none" stroke-linecap="round"/><path d="M76 21 C78 17 92 15 95 21 C96 48 92 82 86 88 C80 82 75 48 76 21 Z" fill="#3E3446"/><ellipse cx="61.5" cy="342" rx="34" ry="25" fill="none" stroke="#B42318" stroke-width="2" stroke-dasharray="3 6" opacity=".7"/><ellipse cx="61.5" cy="342" rx="25" ry="18" fill="url(#fmps)" stroke="#B42318" stroke-width="3.5"/></g></g><path d="M91.0 156.0 A100 100 0 0 1 201.0 156.0" stroke="#B42318" stroke-width="4" fill="none" opacity="0.72" stroke-linecap="round"/><path d="M77.8 135.84 A124 124 0 0 1 214.2 135.84" stroke="#B42318" stroke-width="4" fill="none" opacity="0.48" stroke-linecap="round"/><path d="M64.6 115.68 A148 148 0 0 1 227.4 115.68" stroke="#B42318" stroke-width="4" fill="none" opacity="0.28" stroke-linecap="round"/><circle cx="95.6" cy="246.0" r="11" fill="url(#fmps)" stroke="#B42318" stroke-width="2.5"/><circle cx="330" cy="113" r="7" fill="#B42318"/><text x="348" y="120" font-size="20" font-weight="800" fill="#1A1A2E" text-anchor="start">Throb like a heartbeat</text><text x="348" y="143" font-size="16" font-weight="500" fill="#4A4A5A" text-anchor="start">pressure with nowhere to go</text><circle cx="330" cy="179" r="7" fill="#B42318"/><text x="348" y="186" font-size="20" font-weight="800" fill="#1A1A2E" text-anchor="start">Hurts to bite or tap</text><text x="348" y="209" font-size="16" font-weight="500" fill="#4A4A5A" text-anchor="start">like stepping on a bruise</text><circle cx="330" cy="245" r="7" fill="#B42318"/><text x="348" y="252" font-size="20" font-weight="800" fill="#1A1A2E" text-anchor="start">Hot can make it roar</text><text x="348" y="275" font-size="16" font-weight="500" fill="#4A4A5A" text-anchor="start">cold may calm it for a minute</text><circle cx="330" cy="311" r="7" fill="#B42318"/><text x="348" y="318" font-size="20" font-weight="800" fill="#1A1A2E" text-anchor="start">Puffy gum or a bump</text><text x="348" y="341" font-size="16" font-weight="500" fill="#4A4A5A" text-anchor="start">like a pimple on the gum</text><circle cx="330" cy="377" r="7" fill="#B42318"/><text x="348" y="384" font-size="20" font-weight="800" fill="#1A1A2E" text-anchor="start">Bad taste or smell</text><text x="348" y="407" font-size="16" font-weight="500" fill="#4A4A5A" text-anchor="start">when the pocket leaks a little</text><clipPath id="fmhc"><rect x="8" y="8" width="624" height="704" rx="22"/></clipPath><g clip-path="url(#fmhc)"><g transform="translate(360 448) scale(0.9)"><path d="M150 20 C100 15 62 40 58 85 C56 100 54 110 50 122 L36 148 C34 154 40 158 48 158 C49 165 46 170 44 174 C48 178 49 182 45 187 C46 194 50 200 54 207 C58 215 70 220 88 218 C104 216 118 214 124 214 L128 300 L214 300 C206 262 206 236 218 208 C240 172 244 112 226 72 C208 36 184 22 150 20 Z" fill="#E9EEF8" stroke="#B8C3D9" stroke-width="2.5"/><path d="M58 206 C90 206 132 204 150 196 C162 188 164 168 160 152" stroke="#B8C3D9" stroke-width="2.5" fill="none" stroke-dasharray="5 6"/><ellipse cx="170" cy="136" rx="13" ry="22" fill="#DCE4F2" stroke="#B8C3D9" stroke-width="2.5"/></g></g><path d="M469.8 620.8 L513.0 570.4" stroke="#B42318" stroke-width="3" stroke-dasharray="6 6" fill="none"/><circle cx="513.0" cy="570.4" r="6" fill="#B42318"/><path d="M469.8 620.8 L475.2 538.0" stroke="#B42318" stroke-width="3" stroke-dasharray="6 6" fill="none"/><circle cx="475.2" cy="538.0" r="6" fill="#B42318"/><path d="M469.8 620.8 L495.0 683.8" stroke="#B42318" stroke-width="3" stroke-dasharray="6 6" fill="none"/><circle cx="495.0" cy="683.8" r="6" fill="#B42318"/><circle cx="469.8" cy="620.8" r="9" fill="#FFFFFF" stroke="#B42318" stroke-width="4"/><text x="40" y="512" font-size="21" font-weight="800" fill="#1A1A2E" text-anchor="start"><tspan x="40" dy="0">Pain can travel</tspan><tspan x="40" dy="26.2">to the ear, temple,</tspan><tspan x="40" dy="26.2">or neck on the</tspan><tspan x="40" dy="26.2">same side.</tspan></text><text x="40" y="634" font-size="17" font-weight="700" fill="#B42318" text-anchor="start"><tspan x="40" dy="0">Swelling toward the eye</tspan><tspan x="40" dy="21.2">or neck: red flag stop.</tspan></text></svg>
