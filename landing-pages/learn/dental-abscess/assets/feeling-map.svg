<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 720" width="640" height="720" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>What a dental abscess feels like</title><defs>
