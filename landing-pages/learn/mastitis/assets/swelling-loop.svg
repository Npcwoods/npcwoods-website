<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 540" width="640" height="540" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>The swelling loop</title><rect width="640" height="540" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="538" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">The swelling loop</text><circle cx="58" cy="130" r="14" fill="#fff" stroke="#B45309" stroke-width="4"/><text x="96" y="134" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Tissue swells</text><text x="96" y="159" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Busy milk tissue gets inflamed.</text><path d="M58 146 V221" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="225" r="14" fill="#fff" stroke="#C2410C" stroke-width="4"/><text x="96" y="229" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Ducts narrow</text><text x="96" y="254" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Swelling pinches the soft milk straws.</text><path d="M58 241 V316" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="320" r="14" fill="#fff" stroke="#B42318" stroke-width="4"/><text x="96" y="324" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Milk slows, pressure builds</text><text x="96" y="349" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fullness adds to the swelling, and the loop</text><text x="96" y="369" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">repeats.</text><path d="M58 336 V431" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="435" r="14" fill="#fff" stroke="#15803D" stroke-width="4"/><text x="96" y="439" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Break the loop</text><text x="96" y="464" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cold, gentle touch, rest, and normal feeding</text><text x="96" y="484" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">calm the swelling.</text></svg>