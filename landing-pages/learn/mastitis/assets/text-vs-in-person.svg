<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 581" width="360" height="581" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Which door fits?</title><rect width="360" height="581" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="579" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Which door fits?</text><text x="24" y="99" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">When in doubt, go in.</text><rect x="20" y="125" width="320" height="212" rx="14" fill="#F6F3EE"/><rect x="20" y="125" width="8" height="212" rx="4" fill="#2563EB"/><text x="36" y="165" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Text visit</text><circle cx="42" cy="188" r="4.5" fill="#2563EB"/><text x="56" y="193" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">One sore, red, warm area</text><circle cx="42" cy="216" r="4.5" fill="#2563EB"/><text x="56" y="221" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fever under 103°F</text><circle cx="42" cy="244" r="4.5" fill="#2563EB"/><text x="56" y="249" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Eating and drinking okay</text><circle cx="42" cy="272" r="4.5" fill="#2563EB"/><text x="56" y="277" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">No pus, no growing lump</text><circle cx="42" cy="300" r="4.5" fill="#2563EB"/><text x="56" y="305" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">In a state I treat</text><rect x="20" y="349" width="320" height="212" rx="14" fill="#F6F3EE"/><rect x="20" y="349" width="8" height="212" rx="4" fill="#B42318"/><text x="36" y="389" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">In person or ER</text><circle cx="42" cy="412" r="4.5" fill="#B42318"/><text x="56" y="417" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Any red flag</text><circle cx="42" cy="440" r="4.5" fill="#B42318"/><text x="56" y="445" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A lump that stays or grows</text><circle cx="42" cy="468" r="4.5" fill="#B42318"/><text x="56" y="473" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Not better after 48 hours</text><circle cx="42" cy="496" r="4.5" fill="#B42318"/><text x="56" y="501" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Not breastfeeding</text><circle cx="42" cy="524" r="4.5" fill="#B42318"/><text x="56" y="529" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Weak immune system</text></svg>