<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 396" width="640" height="396" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Comfort care: helps vs skip</title><rect width="640" height="396" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="394" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Comfort care: helps vs skip</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">General education, not a personal plan.</text><rect x="28" y="129" width="285" height="237" rx="14" fill="#F6F3EE"/><rect x="28" y="129" width="285" height="8" rx="4" fill="#15803D"/><text x="40.0" y="169" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Often helps</text><circle cx="44" cy="191" r="4" fill="#15803D"/><text x="56.0" y="196" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Feed on demand</text><circle cx="44" cy="219" r="4" fill="#15803D"/><text x="56.0" y="224" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cold packs between feeds</text><circle cx="44" cy="247" r="4" fill="#15803D"/><text x="56.0" y="252" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Feather-light strokes toward</text><text x="56.0" y="272" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">the armpit</text><circle cx="44" cy="295" r="4" fill="#15803D"/><text x="56.0" y="300" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Supportive, loose bra</text><circle cx="44" cy="323" r="4" fill="#15803D"/><text x="56.0" y="328" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Rest and fluids</text><rect x="327" y="129" width="285" height="237" rx="14" fill="#F6F3EE"/><rect x="327" y="129" width="285" height="8" rx="4" fill="#B42318"/><text x="339.0" y="169" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Skip</text><circle cx="343" cy="191" r="4" fill="#B42318"/><text x="355.0" y="196" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Deep, hard massage</text><circle cx="343" cy="219" r="4" fill="#B42318"/><text x="355.0" y="224" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Long heat or hot soaks</text><circle cx="343" cy="247" r="4" fill="#B42318"/><text x="355.0" y="252" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Extra pumping to empty</text><circle cx="343" cy="275" r="4" fill="#B42318"/><text x="355.0" y="280" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Stopping feeds suddenly</text><circle cx="343" cy="303" r="4" fill="#B42318"/><text x="355.0" y="308" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Picking a nipple white dot</text></svg>