<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 656" width="360" height="656" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Comfort care: helps vs skip</title><rect width="360" height="656" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="654" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Comfort care: helps vs</text><text x="24" y="87" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">skip</text><text x="24" y="130" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">General education, not a personal</text><text x="24" y="152" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">plan.</text><rect x="20" y="178" width="320" height="234" rx="14" fill="#F6F3EE"/><rect x="20" y="178" width="8" height="234" rx="4" fill="#15803D"/><text x="36" y="218" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Often helps</text><circle cx="42" cy="241" r="4.5" fill="#15803D"/><text x="56" y="246" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Feed on demand</text><circle cx="42" cy="269" r="4.5" fill="#15803D"/><text x="56" y="274" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cold packs between feeds</text><circle cx="42" cy="297" r="4.5" fill="#15803D"/><text x="56" y="302" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Feather-light strokes toward</text><text x="56" y="324" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">the armpit</text><circle cx="42" cy="347" r="4.5" fill="#15803D"/><text x="56" y="352" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Supportive, loose bra</text><circle cx="42" cy="375" r="4.5" fill="#15803D"/><text x="56" y="380" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Rest and fluids</text><rect x="20" y="424" width="320" height="212" rx="14" fill="#F6F3EE"/><rect x="20" y="424" width="8" height="212" rx="4" fill="#B42318"/><text x="36" y="464" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Skip</text><circle cx="42" cy="487" r="4.5" fill="#B42318"/><text x="56" y="492" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Deep, hard massage</text><circle cx="42" cy="515" r="4.5" fill="#B42318"/><text x="56" y="520" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Long heat or hot soaks</text><circle cx="42" cy="543" r="4.5" fill="#B42318"/><text x="56" y="548" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Extra pumping to empty</text><circle cx="42" cy="571" r="4.5" fill="#B42318"/><text x="56" y="576" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Stopping feeds suddenly</text><circle cx="42" cy="599" r="4.5" fill="#B42318"/><text x="56" y="604" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Picking a nipple white dot</text></svg>