<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 545" width="640" height="545" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>The mastitis spectrum</title><rect width="640" height="545" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="543" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">The mastitis spectrum</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">From mild to serious. Most cases stay near the top.</text><circle cx="58" cy="155" r="14" fill="#fff" stroke="#2563EB" stroke-width="4"/><text x="96" y="159" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Narrowed duct</text><text x="96" y="184" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A tender lump. No fever. You feel fine.</text><path d="M58 171 V246" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="250" r="14" fill="#fff" stroke="#B45309" stroke-width="4"/><text x="96" y="254" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Inflammatory mastitis</text><text x="96" y="279" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A red or warm wedge. Often fever and aches.</text><path d="M58 266 V341" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="345" r="14" fill="#fff" stroke="#C2410C" stroke-width="4"/><text x="96" y="349" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Bacterial mastitis</text><text x="96" y="374" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Inflammation plus germs. Slower to improve.</text><path d="M58 361 V436" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="58" cy="440" r="14" fill="#fff" stroke="#B42318" stroke-width="4"/><text x="96" y="444" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Abscess</text><text x="96" y="469" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A pocket of pus. Needs an ultrasound and often</text><text x="96" y="489" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">drainage.</text></svg>