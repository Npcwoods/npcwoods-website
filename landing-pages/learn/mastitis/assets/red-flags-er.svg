<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 453" width="640" height="453" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Go to the ER or call 911</title><rect width="640" height="453" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="451" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Go to the ER or call 911</text><text x="36" y="96" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Do not text first. Go.</text><rect x="28" y="129" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="139" width="144" height="46" rx="10" fill="#B42318"/><text x="112" y="167.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fever</text><text x="200" y="159" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">103°F or higher, or shaking chills that</text><text x="200" y="180" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">will not stop.</text><rect x="28" y="205" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="215" width="144" height="46" rx="10" fill="#B42318"/><text x="112" y="243.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Spreading</text><text x="200" y="235" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red streaks spreading fast toward the</text><text x="200" y="256" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">armpit or chest.</text><rect x="28" y="281" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="291" width="144" height="46" rx="10" fill="#B42318"/><text x="112" y="319.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Pus or lump</text><text x="200" y="311" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Pus draining, or a soft lump that is</text><text x="200" y="332" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">growing.</text><rect x="28" y="357" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="367" width="144" height="46" rx="10" fill="#B42318"/><text x="112" y="395.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Whole body</text><text x="200" y="387" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Racing heart, fast breathing, faint,</text><text x="200" y="408" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">dizzy, or confused.</text></svg>