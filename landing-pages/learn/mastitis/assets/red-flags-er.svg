<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 577" width="360" height="577" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Go to the ER or call 911</title><rect width="360" height="577" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="575" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Go to the ER or call 911</text><text x="24" y="99" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Do not text first. Go.</text><rect x="20" y="125" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="139" width="75" height="28" rx="14" fill="#B42318"/><text x="72" y="158" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fever</text><text x="36" y="187" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">103°F or higher, or shaking chills</text><text x="36" y="209" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">that will not stop.</text><rect x="20" y="235" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="249" width="112" height="28" rx="14" fill="#B42318"/><text x="90" y="268" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Spreading</text><text x="36" y="297" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red streaks spreading fast toward</text><text x="36" y="319" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">the armpit or chest.</text><rect x="20" y="345" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="359" width="131" height="28" rx="14" fill="#B42318"/><text x="100" y="378" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Pus or lump</text><text x="36" y="407" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Pus draining, or a soft lump that</text><text x="36" y="429" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">is growing.</text><rect x="20" y="455" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="469" width="122" height="28" rx="14" fill="#B42318"/><text x="95" y="488" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Whole body</text><text x="36" y="517" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Racing heart, fast breathing,</text><text x="36" y="539" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">faint, dizzy, or confused.</text></svg>