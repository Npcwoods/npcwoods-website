<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" width="640" height="428" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Sore breast while feeding: quick sort</title><rect width="640" height="428" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="426" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Sore breast while feeding: quick sort</text><rect x="28" y="104" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="114" width="144" height="46" rx="10" fill="#2563EB"/><text x="112" y="142.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Engorgement</text><text x="200" y="134" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Both sides full and firm, days 2 to 5.</text><text x="200" y="155" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Low fever at most.</text><rect x="28" y="180" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="190" width="144" height="46" rx="10" fill="#334155"/><text x="112" y="218.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Narrowed duct</text><text x="200" y="210" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">One tender lump. No fever. You feel</text><text x="200" y="231" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">fine.</text><rect x="28" y="256" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="266" width="144" height="46" rx="10" fill="#B45309"/><text x="112" y="294.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Mastitis</text><text x="200" y="286" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hot, red wedge on one side. Often fever</text><text x="200" y="307" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">and aches.</text><rect x="28" y="332" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="342" width="144" height="46" rx="10" fill="#B42318"/><text x="112" y="370.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Abscess</text><text x="200" y="362" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A lump that stays or grows, may feel</text><text x="200" y="383" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">soft. Needs an ultrasound.</text></svg>