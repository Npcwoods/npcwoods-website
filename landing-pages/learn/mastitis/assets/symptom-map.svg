<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 323" width="640" height="323" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>What mastitis feels like</title><rect width="640" height="323" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="321" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">What mastitis feels like</text><rect x="28" y="104" width="285" height="189" rx="14" fill="#F6F3EE"/><rect x="28" y="104" width="285" height="8" rx="4" fill="#B42318"/><text x="40.0" y="144" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">In the breast</text><circle cx="44" cy="166" r="4" fill="#B42318"/><text x="56.0" y="171" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Warm, tender wedge</text><circle cx="44" cy="194" r="4" fill="#B42318"/><text x="56.0" y="199" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red, pink, or darker skin</text><circle cx="44" cy="222" r="4" fill="#B42318"/><text x="56.0" y="227" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Firm or swollen area</text><circle cx="44" cy="250" r="4" fill="#B42318"/><text x="56.0" y="255" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Pain while feeding</text><rect x="327" y="104" width="285" height="189" rx="14" fill="#F6F3EE"/><rect x="327" y="104" width="285" height="8" rx="4" fill="#334155"/><text x="339.0" y="144" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">In the body</text><circle cx="343" cy="166" r="4" fill="#334155"/><text x="355.0" y="171" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fever 100.4°F or higher</text><circle cx="343" cy="194" r="4" fill="#334155"/><text x="355.0" y="199" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Chills and aches</text><circle cx="343" cy="222" r="4" fill="#334155"/><text x="355.0" y="227" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Headache</text><circle cx="343" cy="250" r="4" fill="#334155"/><text x="355.0" y="255" font-size="15" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Wiped out</text></svg>