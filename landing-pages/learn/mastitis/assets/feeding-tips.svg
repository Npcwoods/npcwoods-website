<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 428" width="640" height="428" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Feeding while you heal</title><rect width="640" height="428" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="638" height="426" rx="21" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="36" y="22" width="46" height="5" rx="2.5" fill="#B42318"/><text x="36" y="58" font-size="30" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Feeding while you heal</text><rect x="28" y="104" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="114" width="144" height="46" rx="10" fill="#334155"/><text x="112" y="142.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Start easy</text><text x="200" y="134" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Begin on the comfortable side. Switch</text><text x="200" y="155" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">once milk is flowing.</text><rect x="28" y="180" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="190" width="144" height="46" rx="10" fill="#2563EB"/><text x="112" y="218.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Aim the chin</text><text x="200" y="210" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Point the baby&#x27;s chin toward the sore</text><text x="200" y="231" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">spot.</text><rect x="28" y="256" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="266" width="144" height="46" rx="10" fill="#15803D"/><text x="112" y="294.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">On demand</text><text x="200" y="286" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Feed when the baby wants. No extra</text><text x="200" y="307" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">pumping to empty.</text><rect x="28" y="332" width="584" height="66" rx="14" fill="#F6F3EE"/><rect x="40" y="342" width="144" height="46" rx="10" fill="#B45309"/><text x="112" y="370.0" font-size="15" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Just comfort</text><text x="200" y="362" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">If baby won&#x27;t feed on that side, hand</text><text x="200" y="383" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">express just enough to feel better.</text></svg>