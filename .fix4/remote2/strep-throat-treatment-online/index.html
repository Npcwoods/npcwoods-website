    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            line-height: 1.6;

            background: #fff;

        :root {
            --npc-red: #C41E3A;
            --npc-gray: #4A5568;
            --npc-light: #F7FAFC;
        }

        .nav {

        .nav-content {

            margin: 0 auto;
            padding: 0 40px;

            align-items: center;
        }

        .logo-img {
            height: 50px;
            width: auto;
        }

        .nav-cta {
            background: var(--npc-red);
            color: white;
            padding: 12px 28px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.3s;
        }

        .nav-cta:hover {
            background: #A01828;
            transform: translateY(-1px);
        }

        .hero {
            max-width: 1400px;
            margin: 0 auto;
            padding: 80px 40px;

            grid-template-columns: 1fr 1fr;

            color: #666;

        }

        .hero-image img {
            width: 100%;
            height: auto;
            display: block;
        }

            justify-content: center;
            flex-shrink: 0;
            font-size: 16px;

            color: #1a1a1a;

            font-size: 16px;

            text-align: center;
            padding: 100px 40px;
        }

        .final-cta h2 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .final-cta p {
            font-size: 20px;
            opacity: 0.95;
            margin-bottom: 40px;

            font-size: 36px;
