<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 617" width="360" height="617" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>The swelling loop</title><rect width="360" height="617" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="615" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">The swelling loop</text><circle cx="40" cy="119" r="13" fill="#fff" stroke="#B45309" stroke-width="4"/><text x="72" y="125" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Tissue swells</text><text x="72" y="151" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Busy milk tissue gets</text><text x="72" y="173" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">inflamed.</text><path d="M40 137 V221" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="235" r="13" fill="#fff" stroke="#C2410C" stroke-width="4"/><text x="72" y="241" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Ducts narrow</text><text x="72" y="267" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Swelling pinches the soft milk</text><text x="72" y="289" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">straws.</text><path d="M40 253 V337" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="351" r="13" fill="#fff" stroke="#B42318" stroke-width="4"/><text x="72" y="357" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Milk slows, pressure</text><text x="72" y="381" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">builds</text><text x="72" y="407" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fullness adds to the swelling,</text><text x="72" y="429" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">and the loop repeats.</text><path d="M40 369 V477" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="491" r="13" fill="#fff" stroke="#15803D" stroke-width="4"/><text x="72" y="497" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Break the loop</text><text x="72" y="523" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cold, gentle touch, rest, and</text><text x="72" y="545" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">normal feeding calm the</text><text x="72" y="567" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">swelling.</text></svg>