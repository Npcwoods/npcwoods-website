<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 495" width="360" height="495" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>What mastitis feels like</title><rect width="360" height="495" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="493" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">What mastitis feels like</text><rect x="20" y="95" width="320" height="184" rx="14" fill="#F6F3EE"/><rect x="20" y="95" width="8" height="184" rx="4" fill="#B42318"/><text x="36" y="135" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">In the breast</text><circle cx="42" cy="158" r="4.5" fill="#B42318"/><text x="56" y="163" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Warm, tender wedge</text><circle cx="42" cy="186" r="4.5" fill="#B42318"/><text x="56" y="191" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red, pink, or darker skin</text><circle cx="42" cy="214" r="4.5" fill="#B42318"/><text x="56" y="219" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Firm or swollen area</text><circle cx="42" cy="242" r="4.5" fill="#B42318"/><text x="56" y="247" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Pain while feeding</text><rect x="20" y="291" width="320" height="184" rx="14" fill="#F6F3EE"/><rect x="20" y="291" width="8" height="184" rx="4" fill="#334155"/><text x="36" y="331" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">In the body</text><circle cx="42" cy="354" r="4.5" fill="#334155"/><text x="56" y="359" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fever 100.4°F or higher</text><circle cx="42" cy="382" r="4.5" fill="#334155"/><text x="56" y="387" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Chills and aches</text><circle cx="42" cy="410" r="4.5" fill="#334155"/><text x="56" y="415" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Headache</text><circle cx="42" cy="438" r="4.5" fill="#334155"/><text x="56" y="443" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Wiped out</text></svg>