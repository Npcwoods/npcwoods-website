<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 569" width="360" height="569" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Feeding while you heal</title><rect width="360" height="569" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="567" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Feeding while you heal</text><rect x="20" y="95" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="109" width="122" height="28" rx="14" fill="#334155"/><text x="95" y="128" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Start easy</text><text x="36" y="157" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Begin on the comfortable side.</text><text x="36" y="179" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Switch once milk is flowing.</text><rect x="20" y="205" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="219" width="140" height="28" rx="14" fill="#2563EB"/><text x="104" y="238" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Aim the chin</text><text x="36" y="267" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Point the baby&#x27;s chin toward the</text><text x="36" y="289" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">sore spot.</text><rect x="20" y="315" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="329" width="112" height="28" rx="14" fill="#15803D"/><text x="90" y="348" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">On demand</text><text x="36" y="377" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Feed when the baby wants. No extra</text><text x="36" y="399" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">pumping to empty.</text><rect x="20" y="425" width="320" height="122" rx="14" fill="#F6F3EE"/><rect x="34" y="439" width="140" height="28" rx="14" fill="#B45309"/><text x="104" y="458" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Just comfort</text><text x="36" y="487" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">If baby won&#x27;t feed on that side,</text><text x="36" y="509" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">hand express just enough to feel</text><text x="36" y="531" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">better.</text></svg>