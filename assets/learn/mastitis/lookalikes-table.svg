<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 578" width="360" height="578" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Sore breast while feeding: quick sort</title><rect width="360" height="578" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="576" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Sore breast while</text><text x="24" y="87" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">feeding: quick sort</text><rect x="20" y="126" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="140" width="131" height="28" rx="14" fill="#2563EB"/><text x="100" y="159" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Engorgement</text><text x="36" y="188" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Both sides full and firm, days 2</text><text x="36" y="210" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">to 5. Low fever at most.</text><rect x="20" y="236" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="250" width="150" height="28" rx="14" fill="#334155"/><text x="109" y="269" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Narrowed duct</text><text x="36" y="298" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">One tender lump. No fever. You</text><text x="36" y="320" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">feel fine.</text><rect x="20" y="346" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="360" width="103" height="28" rx="14" fill="#B45309"/><text x="86" y="379" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Mastitis</text><text x="36" y="408" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hot, red wedge on one side. Often</text><text x="36" y="430" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">fever and aches.</text><rect x="20" y="456" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="470" width="93" height="28" rx="14" fill="#B42318"/><text x="80" y="489" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Abscess</text><text x="36" y="518" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A lump that stays or grows, may</text><text x="36" y="540" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">feel soft. Needs an ultrasound.</text></svg>