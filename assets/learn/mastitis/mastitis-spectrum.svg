<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 623" width="360" height="623" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>The mastitis spectrum</title><rect width="360" height="623" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="621" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#B42318"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">The mastitis spectrum</text><text x="24" y="99" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">From mild to serious. Most cases</text><text x="24" y="121" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">stay near the top.</text><circle cx="40" cy="171" r="13" fill="#fff" stroke="#2563EB" stroke-width="4"/><text x="72" y="177" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Narrowed duct</text><text x="72" y="203" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A tender lump. No fever. You</text><text x="72" y="225" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">feel fine.</text><path d="M40 189 V273" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="287" r="13" fill="#fff" stroke="#B45309" stroke-width="4"/><text x="72" y="293" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Inflammatory mastitis</text><text x="72" y="319" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A red or warm wedge. Often</text><text x="72" y="341" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">fever and aches.</text><path d="M40 305 V389" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="403" r="13" fill="#fff" stroke="#C2410C" stroke-width="4"/><text x="72" y="409" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Bacterial mastitis</text><text x="72" y="435" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Inflammation plus germs.</text><text x="72" y="457" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Slower to improve.</text><path d="M40 421 V505" stroke="#B42318" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="519" r="13" fill="#fff" stroke="#B42318" stroke-width="4"/><text x="72" y="525" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Abscess</text><text x="72" y="551" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A pocket of pus. Needs an</text><text x="72" y="573" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">ultrasound and often drainage.</text></svg>