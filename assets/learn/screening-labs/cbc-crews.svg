<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 607" width="360" height="607" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>The three crews in a CBC</title><rect width="360" height="607" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="605" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">The three crews in a CBC</text><rect x="20" y="95" width="320" height="184" rx="14" fill="#F6F3EE"/><rect x="20" y="95" width="8" height="184" rx="4" fill="#B42318"/><text x="36" y="135" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red cells</text><circle cx="42" cy="158" r="4.5" fill="#B42318"/><text x="56" y="163" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Deliver oxygen</text><circle cx="42" cy="186" r="4.5" fill="#B42318"/><text x="56" y="191" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hemoglobin</text><circle cx="42" cy="214" r="4.5" fill="#B42318"/><text x="56" y="219" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Hematocrit</text><circle cx="42" cy="242" r="4.5" fill="#B42318"/><text x="56" y="247" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">MCV (size)</text><rect x="20" y="291" width="320" height="156" rx="14" fill="#F6F3EE"/><rect x="20" y="291" width="8" height="156" rx="4" fill="#0369A1"/><text x="36" y="331" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">White cells</text><circle cx="42" cy="354" r="4.5" fill="#0369A1"/><text x="56" y="359" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Fight germs</text><circle cx="42" cy="382" r="4.5" fill="#0369A1"/><text x="56" y="387" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">WBC count</text><circle cx="42" cy="410" r="4.5" fill="#0369A1"/><text x="56" y="415" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Types of white cells</text><rect x="20" y="459" width="320" height="128" rx="14" fill="#F6F3EE"/><rect x="20" y="459" width="8" height="128" rx="4" fill="#334155"/><text x="36" y="499" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Platelets</text><circle cx="42" cy="522" r="4.5" fill="#334155"/><text x="56" y="527" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Plug leaks</text><circle cx="42" cy="550" r="4.5" fill="#334155"/><text x="56" y="555" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Platelet count</text></svg>