<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 668" width="360" height="668" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>TSH: the thermostat signal</title><rect width="360" height="668" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="666" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">TSH: the thermostat</text><text x="24" y="87" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">signal</text><circle cx="40" cy="150" r="13" fill="#fff" stroke="#0369A1" stroke-width="4"/><text x="72" y="156" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Brain senses the level</text><text x="72" y="182" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">The pituitary gland checks how</text><text x="72" y="204" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">much thyroid hormone is in</text><text x="72" y="226" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">your blood.</text><path d="M40 168 V274" stroke="#0369A1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="288" r="13" fill="#fff" stroke="#0E7490" stroke-width="4"/><text x="72" y="294" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Brain sends TSH</text><text x="72" y="320" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">TSH is the message: turn the</text><text x="72" y="342" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">furnace up.</text><path d="M40 306 V390" stroke="#0369A1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="404" r="13" fill="#fff" stroke="#B42318" stroke-width="4"/><text x="72" y="410" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">High TSH</text><text x="72" y="436" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Usually means the thyroid is</text><text x="72" y="458" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">slow (underactive). The brain</text><text x="72" y="480" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">is yelling.</text><path d="M40 422 V528" stroke="#0369A1" stroke-width="3" stroke-dasharray="2 8" stroke-linecap="round"/><circle cx="40" cy="542" r="13" fill="#fff" stroke="#B45309" stroke-width="4"/><text x="72" y="548" font-size="19" fill="#1A1A2E" font-weight="800" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Low TSH</text><text x="72" y="574" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Usually means the thyroid is</text><text x="72" y="596" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">running hot (overactive). The</text><text x="72" y="618" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">brain is quiet.</text></svg>