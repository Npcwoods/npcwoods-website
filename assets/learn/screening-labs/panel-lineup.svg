<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 740" width="360" height="740" role="img" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title>Five common screening tests</title><rect width="360" height="740" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="358" height="738" rx="19" fill="none" stroke="#E5E7EB" stroke-width="2"/><rect x="24" y="22" width="40" height="5" rx="2.5" fill="#0369A1"/><text x="24" y="56" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">Five common screening</text><text x="24" y="87" font-size="26" fill="#1A1A2E" font-weight="400" text-anchor="start" font-family="'DM Serif Display',Georgia,serif">tests</text><text x="24" y="130" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">What each one checks, in one line.</text><rect x="20" y="156" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="170" width="169" height="28" rx="14" fill="#0369A1"/><text x="118" y="189" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Metabolic panel</text><text x="36" y="218" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Kidneys, liver, salts like sodium</text><text x="36" y="240" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">and potassium, and blood sugar.</text><rect x="20" y="266" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="280" width="131" height="28" rx="14" fill="#0E7490"/><text x="100" y="299" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Cholesterol</text><text x="36" y="328" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">LDL, HDL, and triglycerides: the</text><text x="36" y="350" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">fats riding in your blood.</text><rect x="20" y="376" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="390" width="56" height="28" rx="14" fill="#334155"/><text x="62" y="409" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">A1c</text><text x="36" y="438" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Your average blood sugar over</text><text x="36" y="460" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">about three months.</text><rect x="20" y="486" width="320" height="100" rx="14" fill="#F6F3EE"/><rect x="34" y="500" width="150" height="28" rx="14" fill="#0369A1"/><text x="109" y="519" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">TSH (thyroid)</text><text x="36" y="548" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">The signal that tells your thyroid</text><text x="36" y="570" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">how hard to work.</text><rect x="20" y="596" width="320" height="122" rx="14" fill="#F6F3EE"/><rect x="34" y="610" width="56" height="28" rx="14" fill="#0E7490"/><text x="62" y="629" font-size="16" fill="#FFFFFF" font-weight="800" text-anchor="middle" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">CBC</text><text x="36" y="658" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">Red cells, white cells, and</text><text x="36" y="680" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">platelets: the three crews in your</text><text x="36" y="702" font-size="16" fill="#4A4A5A" font-weight="500" text-anchor="start" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif">blood.</text></svg>