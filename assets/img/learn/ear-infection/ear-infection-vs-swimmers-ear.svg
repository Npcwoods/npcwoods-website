<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 590" width="640" height="590" role="img" aria-labelledby="evs-t" font-family="'DM Sans','Helvetica Neue',Helvetica,Arial,sans-serif"><title id="evs-t">Middle ear infection compared with swimmer's ear</title><rect x="8" y="8" width="624" height="574" rx="22" fill="#F6F2EB" stroke="#E6DFD3"/><text x="32" y="48" font-size="14" font-weight="800" letter-spacing="2.2" fill="#B3261E">TWO DIFFERENT EAR PROBLEMS</text><rect x="24" y="72" width="288" height="486" rx="18" fill="#FFFFFF" stroke="#E6DFD3"/><rect x="46" y="72" width="34" height="4" rx="2" fill="#B3261E"/><text x="46" y="110" font-size="20" font-weight="800" fill="#1B1D29">Middle ear infection</text><text x="46" y="132" font-size="14" fill="#555867">the one this guide covers</text><g transform="translate(58 150)"><path d="M0 30 C 40 24, 90 24, 128 28 L 128 66 C 90 70, 40 70, 0 64 Z" fill="#FBE6DA" stroke="#C98B6D" stroke-width="2"/><ellipse cx="132" cy="47" rx="5" ry="27" fill="#CFE3F5" stroke="#6E98C4" stroke-width="2"/><path d="M138 18 C 150 8, 190 8, 202 20 C 212 36, 212 62, 202 76 C 190 88, 150 88, 138 78 Z" fill="#FFF8EC" stroke="#C9B48F" stroke-width="2"/><path d="M139 56 C 160 52, 186 60, 210 54 C 210 64, 207 70, 202 76 C 190 88, 150 88, 138 78 Z" fill="#E7AE3C" opacity=".85"/><circle cx="172" cy="52" r="30" fill="#B3261E" fill-opacity=".10" stroke="#B3261E" stroke-width="2.4" stroke-dasharray="6 5"/><text x="0" y="104" font-size="12" fill="#555867">ear canal</text><text x="112" y="104" font-size="12" fill="#555867">eardrum</text><text x="170" y="104" font-size="12" fill="#555867">middle ear</text></g><line x1="46" y1="274" x2="290" y2="274" stroke="#EFE9DF"/><text x="46" y="300" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">WHERE</text><text x="46" y="322" font-size="15.5" font-weight="600" fill="#1B1D29">Behind the eardrum</text><line x1="46" y1="334" x2="290" y2="334" stroke="#EFE9DF"/><text x="46" y="360" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">FEELS LIKE</text><text x="46" y="382" font-size="15.5" font-weight="600" fill="#1B1D29">Deep, throbbing pressure,</text><text x="46" y="401" font-size="15.5" font-weight="600" fill="#1B1D29">muffled hearing</text><line x1="46" y1="414" x2="290" y2="414" stroke="#EFE9DF"/><text x="46" y="440" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">OFTEN AFTER</text><text x="46" y="462" font-size="15.5" font-weight="600" fill="#1B1D29">A cold, allergies, or</text><text x="46" y="481" font-size="15.5" font-weight="600" fill="#1B1D29">sinus congestion</text><line x1="46" y1="494" x2="290" y2="494" stroke="#EFE9DF"/><text x="46" y="520" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">TUG YOUR EAR</text><text x="46" y="542" font-size="15.5" font-weight="600" fill="#1B1D29">Pain usually stays the same</text><rect x="328" y="72" width="288" height="486" rx="18" fill="#FFFFFF" stroke="#E6DFD3"/><rect x="350" y="72" width="34" height="4" rx="2" fill="#B3261E"/><text x="350" y="110" font-size="20" font-weight="800" fill="#1B1D29">Swimmer's ear</text><text x="350" y="132" font-size="14" fill="#555867">an outer ear canal infection</text><g transform="translate(362 150)"><path d="M0 30 C 40 24, 90 24, 128 28 L 128 66 C 90 70, 40 70, 0 64 Z" fill="#FBE6DA" stroke="#C98B6D" stroke-width="2"/><ellipse cx="132" cy="47" rx="5" ry="27" fill="#CFE3F5" stroke="#6E98C4" stroke-width="2"/><path d="M138 18 C 150 8, 190 8, 202 20 C 212 36, 212 62, 202 76 C 190 88, 150 88, 138 78 Z" fill="#FFF8EC" stroke="#C9B48F" stroke-width="2"/><path d="M10 34 C 46 29, 90 29, 124 32 L 124 62 C 90 65, 46 65, 10 60 Z" fill="#F29C8E" opacity=".55"/><ellipse cx="64" cy="47" rx="56" ry="30" fill="#B3261E" fill-opacity=".08" stroke="#B3261E" stroke-width="2.4" stroke-dasharray="6 5"/><text x="0" y="104" font-size="12" fill="#555867">ear canal</text><text x="112" y="104" font-size="12" fill="#555867">eardrum</text><text x="170" y="104" font-size="12" fill="#555867">middle ear</text></g><line x1="350" y1="274" x2="594" y2="274" stroke="#EFE9DF"/><text x="350" y="300" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">WHERE</text><text x="350" y="322" font-size="15.5" font-weight="600" fill="#1B1D29">The outer ear canal</text><line x1="350" y1="334" x2="594" y2="334" stroke="#EFE9DF"/><text x="350" y="360" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">FEELS LIKE</text><text x="350" y="382" font-size="15.5" font-weight="600" fill="#1B1D29">Itchy, sore canal that can</text><text x="350" y="401" font-size="15.5" font-weight="600" fill="#1B1D29">look red or swollen</text><line x1="350" y1="414" x2="594" y2="414" stroke="#EFE9DF"/><text x="350" y="440" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">OFTEN AFTER</text><text x="350" y="462" font-size="15.5" font-weight="600" fill="#1B1D29">Water stays in the ear,</text><text x="350" y="481" font-size="15.5" font-weight="600" fill="#1B1D29">or scratching the canal</text><line x1="350" y1="494" x2="594" y2="494" stroke="#EFE9DF"/><text x="350" y="520" font-size="12.5" font-weight="800" letter-spacing="1.2" fill="#B3261E">TUG YOUR EAR</text><text x="350" y="542" font-size="15.5" font-weight="600" fill="#1B1D29">Hurts more</text></svg>
